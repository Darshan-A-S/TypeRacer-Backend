spring.application.name=TypeRacer

# --- Database (override with DB_URL / DB_USERNAME / DB_PASSWORD env in production) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/typeracer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Darshan@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT (override with JWT_SECRET / JWT_EXPIRATION_MS env in production) ---
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
