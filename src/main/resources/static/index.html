<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeRacer</title>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 720px; margin: 0 auto; padding: 24px; }

    h1 { font-size: 28px; font-weight: 700; margin-bottom: 24px; color: #fff; }
    h1 span { color: #7c4dff; }

    .card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 12px; }

    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%; padding: 10px 12px; background: #12121e; border: 1px solid #333; border-radius: 8px;
      color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #7c4dff; }
    .input-row { display: flex; gap: 12px; align-items: flex-end; }
    .input-row > div { flex: 1; }

    button {
      padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: #7c4dff; color: #fff; }
    .btn-primary:hover { background: #651fff; }
    .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
    .btn-success { background: #00c853; color: #fff; }
    .btn-success:hover { background: #00b848; }
    .btn-success:disabled { background: #333; color: #666; cursor: not-allowed; }
    .btn-danger { background: #ff1744; color: #fff; }
    .btn-danger:hover { background: #e0153b; }

    .room-code { font-size: 22px; font-weight: 700; color: #7c4dff; letter-spacing: 2px; font-family: monospace; }

    .player-list { list-style: none; }
    .player-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 6px;
      background: #12121e; border-radius: 8px; border: 1px solid #2a2a3e;
    }
    .player-name { font-weight: 600; flex: 1; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    .badge-host { background: #1a237e; color: #82b1ff; }
    .badge-ready { background: #1b5e20; color: #69f0ae; }
    .badge-notready { background: #4a1520; color: #ff8a80; }

    .btn-row { display: flex; gap: 10px; margin-top: 12px; }

    .race-text {
      font-size: 18px; line-height: 1.6; padding: 16px; background: #12121e;
      border-radius: 8px; margin-bottom: 12px; font-family: 'Courier New', monospace; letter-spacing: 0.5px;
    }
    .race-text .typed-correct { color: #69f0ae; }
    .race-text .typed-wrong { color: #ff1744; text-decoration: underline; }
    .race-text .cursor { border-left: 2px solid #7c4dff; animation: blink 0.8s step-end infinite; }
    .race-text .untyped { color: #555; }
    @keyframes blink { 50% { border-color: transparent; } }

    #typeInput {
      width: 100%; padding: 14px; font-size: 18px; background: #12121e; border: 2px solid #333;
      border-radius: 8px; color: #fff; font-family: 'Courier New', monospace; outline: none; transition: border-color 0.2s;
    }
    #typeInput:focus { border-color: #7c4dff; }

    .progress-section { margin-top: 16px; }
    .progress-row { margin-bottom: 10px; }
    .progress-label { font-size: 13px; color: #aaa; margin-bottom: 3px; display: flex; justify-content: space-between; }
    .progress-track { background: #1a1a2e; border-radius: 6px; height: 24px; overflow: hidden; border: 1px solid #2a2a3e; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #7c4dff, #448aff); border-radius: 6px; transition: width 0.15s; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 700; }

    .countdown-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; font-size: 120px; font-weight: 700;
      color: #7c4dff; z-index: 100; animation: pop 0.3s ease;
    }
    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .winner-banner {
      text-align: center; padding: 24px; background: linear-gradient(135deg, #1a1a2e, #2a1a3e);
      border: 2px solid #7c4dff; border-radius: 12px; margin-bottom: 16px;
    }
    .winner-banner h2 { font-size: 24px; color: #7c4dff; margin-bottom: 8px; }
    .winner-banner .wpm { font-size: 36px; font-weight: 700; color: #69f0ae; }

    .results-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .results-table th { text-align: left; font-size: 12px; text-transform: uppercase; color: #888; padding: 8px; border-bottom: 1px solid #2a2a3e; }
    .results-table td { padding: 8px; border-bottom: 1px solid #1a1a2e; }
    .results-table tr.winner td { color: #69f0ae; font-weight: 600; }

    #status { font-size: 13px; color: #666; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Type<span>Racer</span></h1>

    <!-- Join Screen -->
    <div id="joinScreen" class="card">
      <h3>Join Game</h3>
      <div class="input-row">
        <div>
          <label>Player Name</label>
          <input type="text" id="playerName" placeholder="Your name">
        </div>
        <div>
          <label>Room Code <span style="color:#555">(optional)</span></label>
          <input type="text" id="roomId" placeholder="Leave blank to create">
        </div>
      </div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn-primary" id="joinBtn" onclick="connectAndJoin()">Join</button>
      </div>
      <div id="status"></div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobbyScreen" class="card hidden">
      <h3>Lobby</h3>
      <div style="margin-bottom:12px">
        <span style="font-size:13px;color:#888">Room Code</span>
        <div class="room-code" id="roomCodeDisplay"></div>
      </div>
      <ul class="player-list" id="playerList"></ul>
      <div class="btn-row">
        <button class="btn-success" id="readyBtn" onclick="toggleReady()">Ready Up</button>
        <button class="btn-primary" id="startBtn" onclick="startGame()" disabled>Start Game</button>
      </div>
    </div>

    <!-- Race Screen -->
    <div id="raceScreen" class="card hidden">
      <div class="race-text" id="raceText"></div>
      <input type="text" id="typeInput" placeholder="Type here when the race starts..." disabled oninput="onType()">
      <div class="progress-section" id="progressBars"></div>
    </div>

    <!-- Results Screen -->
    <div id="resultsScreen" class="card hidden">
      <div class="winner-banner">
        <h2 id="winnerName"></h2>
        <div class="wpm" id="winnerWpm"></div>
        <div style="color:#888;font-size:14px">WPM</div>
      </div>
      <h3>Results</h3>
      <table class="results-table">
        <thead><tr><th>Player</th><th>WPM</th><th>Chars</th></tr></thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn-primary" onclick="resetUI()">Play Again</button>
      </div>
    </div>
  </div>

  <!-- Countdown Overlay -->
  <div id="countdownOverlay" class="countdown-overlay hidden"></div>

  <script>
    let client = null;
    let myPlayerId = null;
    let myRoomId = null;
    let targetText = '';
    let raceActive = false;
    let iAmHost = false;
    let iAmReady = false;
    let playerNameValue = '';

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }
    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    function connectAndJoin() {
      playerNameValue = document.getElementById('playerName').value.trim() || ('Player' + Math.floor(Math.random() * 1000));
      const roomIdInput = document.getElementById('roomId').value.trim();
      document.getElementById('joinBtn').disabled = true;
      setStatus('Connecting...');

      client = new StompJs.Client({
        brokerURL: 'ws://' + location.host + '/ws/websocket',
        onConnect: () => {
          client.subscribe('/user/queue/room-joined', (msg) => {
            const data = JSON.parse(msg.body);
            myPlayerId = data.playerId;
            myRoomId = data.roomId;

            document.getElementById('roomCodeDisplay').textContent = data.roomId;
            hide('joinScreen');
            show('lobbyScreen');
            setStatus('');

            if (data.players) renderLobby(data.players);
            subscribeToRoom(data.roomId);
          });

          client.subscribe('/user/queue/errors', (msg) => {
            setStatus('Error: ' + msg.body);
            document.getElementById('joinBtn').disabled = false;
          });

          client.publish({
            destination: '/app/join',
            body: JSON.stringify({ roomId: roomIdInput || null, playerName: playerNameValue })
          });
        },
        onStompError: (frame) => {
          setStatus('STOMP error: ' + frame.headers['message']);
          document.getElementById('joinBtn').disabled = false;
        },
        onWebSocketError: () => {
          setStatus('WebSocket error - is the app running?');
          document.getElementById('joinBtn').disabled = false;
        },
      });
      client.activate();
    }

    function subscribeToRoom(roomId) {
      client.subscribe('/topic/room/' + roomId, (msg) => {
        const data = JSON.parse(msg.body);
        handleRoomMessage(data);
      });
    }

    function handleRoomMessage(data) {
      if (data.players !== undefined) {
        renderLobby(data.players);
      } else if (data.targetText && data.playerNames) {
        targetText = data.targetText;
        hide('lobbyScreen');
        show('raceScreen');
        document.getElementById('typeInput').disabled = true;
        document.getElementById('typeInput').value = '';
        document.getElementById('progressBars').innerHTML = '';
        renderRaceText('');
      } else if (data.secondsRemaining !== undefined) {
        if (data.secondsRemaining > 0) {
          const overlay = document.getElementById('countdownOverlay');
          overlay.textContent = data.secondsRemaining;
          overlay.classList.remove('hidden');
        } else {
          document.getElementById('countdownOverlay').classList.add('hidden');
          raceActive = true;
          document.getElementById('typeInput').disabled = false;
          document.getElementById('typeInput').focus();
        }
      } else if (data.winnerId !== undefined) {
        raceActive = false;
        document.getElementById('typeInput').disabled = true;
        hide('raceScreen');
        show('resultsScreen');

        const winner = data.results.find(r => r.playerId === data.winnerId);
        document.getElementById('winnerName').textContent = winner ? winner.playerName : 'Unknown';
        document.getElementById('winnerWpm').textContent = winner ? winner.wpm.toFixed(1) : '0';

        const tbody = document.getElementById('resultsBody');
        tbody.innerHTML = '';
        data.results.forEach(r => {
          const tr = document.createElement('tr');
          if (r.playerId === data.winnerId) tr.className = 'winner';
          tr.innerHTML = '<td>' + r.playerName + (r.playerId === myPlayerId ? ' (you)' : '') + '</td>'
            + '<td>' + r.wpm.toFixed(1) + '</td>'
            + '<td>' + r.correctChars + '</td>';
          tbody.appendChild(tr);
        });
      } else if (data.playerId && data.wpm !== undefined) {
        updateProgressBar(data.playerId, data.charIndex, data.wpm);
      }
    }

    function renderLobby(players) {
      const listEl = document.getElementById('playerList');
      listEl.innerHTML = '';

      players.forEach(p => {
        if (p.playerId === myPlayerId) {
          iAmHost = p.host;
          iAmReady = p.ready;
        }

        const li = document.createElement('li');
        li.className = 'player-row';

        const name = document.createElement('span');
        name.className = 'player-name';
        name.textContent = p.name + (p.playerId === myPlayerId ? ' (you)' : '');
        li.appendChild(name);

        if (p.host) {
          const badge = document.createElement('span');
          badge.className = 'badge badge-host';
          badge.textContent = 'Host';
          li.appendChild(badge);
        }

        const readyBadge = document.createElement('span');
        readyBadge.className = 'badge ' + (p.ready ? 'badge-ready' : 'badge-notready');
        readyBadge.textContent = p.ready ? 'Ready' : 'Not Ready';
        li.appendChild(readyBadge);

        listEl.appendChild(li);
      });

      document.getElementById('readyBtn').textContent = iAmReady ? 'Unready' : 'Ready Up';
      document.getElementById('readyBtn').className = iAmReady ? 'btn-danger' : 'btn-success';

      const allReady = players.length >= 2 && players.every(p => p.ready);
      const startBtn = document.getElementById('startBtn');
      startBtn.style.display = iAmHost ? 'inline-block' : 'none';
      startBtn.disabled = !allReady;
      startBtn.textContent = allReady ? 'Start Game' : 'Waiting for all players...';
    }

    function toggleReady() {
      iAmReady = !iAmReady;
      client.publish({
        destination: '/app/ready',
        body: JSON.stringify({ roomId: myRoomId, playerId: myPlayerId, ready: iAmReady })
      });
    }

    function startGame() {
      client.publish({
        destination: '/app/start',
        body: JSON.stringify({ roomId: myRoomId, playerId: myPlayerId })
      });
    }

    function renderRaceText(typed) {
      const el = document.getElementById('raceText');
      let html = '';
      for (let i = 0; i < targetText.length; i++) {
        if (i < typed.length) {
          if (typed[i] === targetText[i]) {
            html += '<span class="typed-correct">' + escapeHtml(targetText[i]) + '</span>';
          } else {
            html += '<span class="typed-wrong">' + escapeHtml(targetText[i]) + '</span>';
          }
        } else if (i === typed.length) {
          html += '<span class="cursor">' + escapeHtml(targetText[i]) + '</span>';
        } else {
          html += '<span class="untyped">' + escapeHtml(targetText[i]) + '</span>';
        }
      }
      el.innerHTML = html;
    }

    function escapeHtml(ch) {
      if (ch === '<') return '&lt;';
      if (ch === '>') return '&gt;';
      if (ch === '&') return '&amp;';
      if (ch === ' ') return '&nbsp;';
      return ch;
    }

    function updateProgressBar(playerId, charIndex, wpm) {
      let barWrap = document.getElementById('bar-' + playerId);
      if (!barWrap) {
        const container = document.getElementById('progressBars');
        const row = document.createElement('div');
        row.className = 'progress-row';

        const label = document.createElement('div');
        label.className = 'progress-label';
        label.id = 'label-' + playerId;
        label.innerHTML = '<span>' + playerId.substring(0, 8) + '</span><span>' + wpm.toFixed(0) + ' WPM</span>';

        const track = document.createElement('div');
        track.className = 'progress-track';
        track.id = 'bar-' + playerId;
        const fill = document.createElement('div');
        fill.className = 'progress-fill';
        track.appendChild(fill);

        row.appendChild(label);
        row.appendChild(track);
        container.appendChild(row);
        barWrap = track;
      } else {
        const label = document.getElementById('label-' + playerId);
        if (label) label.innerHTML = '<span>' + playerId.substring(0, 8) + (playerId === myPlayerId ? ' (you)' : '') + '</span><span>' + wpm.toFixed(0) + ' WPM</span>';
      }
      const pct = targetText ? Math.min(100, (charIndex / targetText.length) * 100) : 0;
      barWrap.querySelector('.progress-fill').style.width = pct + '%';
    }

    function onType() {
      if (!raceActive) return;
      const typed = document.getElementById('typeInput').value;
      let correct = 0;
      for (let i = 0; i < typed.length; i++) {
        if (i >= targetText.length) break;
        if (typed[i] === targetText[i]) correct++;
        else break;
      }

      renderRaceText(typed);

      client.publish({
        destination: '/app/progress',
        body: JSON.stringify({
          roomId: myRoomId,
          playerId: myPlayerId,
          charIndex: typed.length,
          correctChars: correct
        })
      });
    }

    function resetUI() {
      myPlayerId = null;
      myRoomId = null;
      targetText = '';
      raceActive = false;
      iAmHost = false;
      iAmReady = false;

      if (client) { client.deactivate(); client = null; }

      hide('resultsScreen');
      hide('raceScreen');
      hide('lobbyScreen');
      show('joinScreen');
      document.getElementById('joinBtn').disabled = false;
      document.getElementById('playerName').value = playerNameValue;
      document.getElementById('roomId').value = '';
      setStatus('');
    }
  </script>
</body>
</html>
